<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuette Configuration</title>
    <style>
        *, *::after, *::before {
            box-sizing: border-box;
        }

        :root {
            --clr-bg: #142228;
            --clr-banner: linear-gradient(#0000, #1e443abc);
            --clr-banner-border: #1e443a;
            --clr-banner-warning: linear-gradient(to left, #e9981660 60%, #0000 120%);
            --clr-banner-warning-border: #e99816;
            --clr-alarm-card: #2a4956;
            --clr-accent: rgb(0, 171, 128);
            --clr-danger: #ff8a75;
            --clr-danger-bg: #c0392b3d;
            --clr-danger-border: #c0392b80;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--clr-bg) linear-gradient(#162629, #1d1f42);
            /* Set background-attachment to fixed so it covers the whole page even if you scroll */
            background-attachment: fixed;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            margin: 0;
        }

        .app {
            padding: 10px;
            padding-bottom: calc(4rem + 20px); /* clears the fixed navbar */
            max-width: 800px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            padding-top: 1.6rem;
        }

        .navbar {
            height: 4rem;
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        .status-banner {
            width: 100%;
            padding: 6px 8px;
            border-radius: 8px;
            background: var(--clr-banner);
            border: 0px solid var(--clr-banner-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-banner.out-of-sync {
            background: var(--clr-banner-warning);
            border-color: var(--clr-banner-warning-border);
            border-width: 0px; /* left here as an idea... not used */
            box-shadow: 0 12px 20px #0004;
        }

        /* Base layout only — the two looks below carry all the visual weight,
           since this button should almost always read as "everything's fine". */
        .sync-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* In-sync (the ~90% case): quiet, easy to ignore */
        .status-banner:not(.out-of-sync) .sync-btn {
            background: #ffffff10;
            border: 0px solid #ffffff20;
            font-weight: normal;
            padding: 6px;
        }

        /* Out-of-sync: the one time it should actually grab attention */
        .status-banner.out-of-sync .sync-btn {
            background-color: #00ab80b0;
            border: 1px solid rgb(0, 99, 74);
            font-weight: bold;
        }

        .status-figure {
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .status-figure img {
            max-height: 100%;
            max-width: 120px;
            object-fit: contain;
            transform: scale(1.5);
            z-index: 10;
        }

        .status-banner:not(.out-of-sync) .status-figure .img-desync { display: none; }
        .status-banner.out-of-sync .status-figure .img-ok { display: none; }

        .alarm-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alarm-card {
            width: 100%;
            padding: 12px 14px;
            font-size: larger;
            border-radius: 8px;
            background: var(--clr-alarm-card);
            border: 1px solid #0003;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .alarm-card.disabled {
            opacity: 0.55;
        }

        .alarm-add-card {
            background-color: #ffffff45;
            border: 1px dashed rgba(255, 255, 255, 0.51);
            justify-content: center;
            cursor: pointer;
            font-size: 2rem;
        }

        /* Tactile press feedback for anything tappable */
        .btn,
        .alarm-action-btn,
        .alarm-add-card,
        .day-pill,
        .sync-btn,
        .navbar-action,
        .time-step {
            transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
        }

        .btn:active,
        .alarm-action-btn:active,
        .alarm-add-card:active,
        .day-pill:active,
        .sync-btn:active,
        .navbar-action:active {
            transform: scale(0.94);
        }

        .time-step:active {
            transform: scale(0.85);
        }

        @media (hover: hover) {
            .btn:hover,
            .alarm-add-card:hover,
            .sync-btn:hover,
            .navbar-action:hover {
                filter: brightness(1.1);
            }

            .alarm-action-btn:hover {
                opacity: 0.8;
            }

            .time-step:hover {
                color: white;
            }
        }

        .alarm-time {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .alarm-days {
            font-size: 0.75rem;
            color: #ffffffa8;
        }

        .alarm-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .alarm-action-btn {
            color: #cfe8ff;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 6px;
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
        }

        .alarm-action-btn.delete {
            color: var(--clr-danger);
        }

        .alarm-action-btn.confirming {
            color: white;
            background: var(--clr-danger-bg);
            border: 1px solid var(--clr-danger-border);
            border-radius: 6px;
        }

        /* Hourglass badge marking whichever card is next in the queue */
        .next-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            color: white;
            flex-shrink: 0;
        }

        .next-badge svg {
            width: 100%;
            height: 100%;
            transform-origin: center;
            animation: hourglass-flip 12s ease-in-out infinite;
        }

        @keyframes hourglass-flip {
            0%   { transform: rotate(0deg)  scale(1.4); }

            10%  { transform: rotate(180deg) scale(1.4); }
            50%  { transform: rotate(180deg) scale(1.4); }

            60%  { transform: rotate(360deg) scale(1.4); }
            100% { transform: rotate(360deg) scale(1.4); }
        }

        /* ---- add/edit modal ---- */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: #000c;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 10;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            position: relative;
            width: 100%;
            max-width: 340px;
            background: #1c333b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(-4rem);
        }

        .modal-icon {
            position: absolute;
            top: 0;
            left: 50%;
            width: 72px;
            height: 72px;
            transform: translate(-50%, -80%) scale(1.6);
            pointer-events: none;
        }

        .time-input-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .time-number {
            padding: 8px;
            font-size: clamp(1.5rem, 12vw, 2.5rem);
            text-align: center;
            border-radius: 8px;
            border: 0px solid #ffffff2e;
            background: #25465148;
            color: white;
            font-family: inherit;
            /* hide the native spinner arrows so it reads as one 24h field, not two odometers */
            appearance: textfield;
            -moz-appearance: textfield;
            width: 100%;
        }

        .time-number::-webkit-inner-spin-button,
        .time-number::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-sep {
            font-size: 1.6rem;
            font-weight: 600;
        }

        .time-field {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 80px;
        }

        .time-step {
            background: none;
            border: none;
            color: #ffffffa0;
            cursor: pointer;
            width: 100%;
            height: 3rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-step svg {
            width: 18px;
            height: 18px;
        }

        .time-step.down svg {
            transform: rotate(180deg);
        }

        .day-pill-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            transition: opacity 0.15s ease;
        }

        .day-pill-row.once-disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .day-pill {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff14;
            border: 0px solid #ffffff2e;
            cursor: pointer;
            user-select: none;
            font-size: 0.85rem;
            transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            font-weight: bold;
        }

        .day-pill.active {
            background: var(--clr-accent);
            border-color: var(--clr-accent);
            color: #08201a;
            font-weight: 700;
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch .slider {
            position: absolute;
            inset: 0;
            background: #ffffff2e;
            border-radius: 999px;
            transition: 0.15s;
            cursor: pointer;
        }

        .switch .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.15s;
        }

        .switch input:checked + .slider {
            background: var(--clr-accent);
        }

        .switch input:checked + .slider::before {
            transform: translateX(20px);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--clr-accent);
            color: #08201a;
            font-weight: 600;
        }

        .btn-secondary {
            background: #ffffff14;
            color: white;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="status-banner" id="status-banner">
            <div style="display: flex; justify-content: space-around; align-items: center; gap: 16px;">
                <div class="status-figure">
                    <img class="img-ok" src="minuta_ok.png" alt="">
                    <img class="img-desync" src="minuta_desync.png" alt="">
                </div>
                <div>
                    <h2 id="status-headline">--:--</h2>
                    <h3 id="status-subtext">Comprobando...</h3>
                </div>
            </div>
            <div class="sync-btn" onclick="syncTime()">
                Sincronizar
            </div>
        </div>
        <hr style="width: 80%; border: 1px solid #fff1;">
        <div id="next-alarm-line" style="display: flex; justify-content: center; align-items: center; padding: 8px">
            Cargando alarmas...
        </div>

        <div class="alarm-card alarm-add-card" onclick="openAlarmModal(null)">
            <span style="transform: scale(1.5);">+</span>
        </div>

        <div class="alarm-list" id="alarm-list"></div>

        <div class="alarm-list" style="opacity: 0.3; text-align: center; padding-top: 5rem;">
            <p>Designed by <b>Rhodune! Lab</b> with Love ❤️</p>
            <a href="https://github.com/Rhodexa/Minuette" style="color: white;">https://github.com/Rhodexa/Minuette</a>
            <p>🇦🇷</p>
        </div>
    </div>

    <div style="position: fixed; bottom: 0.5rem; left: 0.5rem; right: 0.5rem; display: flex; justify-content: center; align-items: center; ">
        <div style="padding: 0.5rem; width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 800px; background-color: #fff2; border-radius: 8px;">
            <div class="navbar-action" style="cursor: pointer; background-color: #00000043; padding: 1rem 2rem; border-radius: 8px; font-weight: bold;" onclick="exitConfigMode()">Cancelar</div>
            <div class="navbar-action" style="cursor: pointer; background-color: #008663; padding: 1rem 2rem; border-radius: 8px; font-weight: bold;" onclick="exitConfigMode()">Guardar y Salir</div>
        </div>
    </div>

    <div class="modal-overlay" id="alarm-modal">
        <div class="modal-card">
            <img src="minuta_set.png" class="modal-icon" alt="">

            <div class="time-input-row">
                <div class="time-field">
                    <button type="button" class="time-step" onclick="stepTime('modal-hour', 1)" aria-label="Subir hora">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
                    </button>
                    <input type="number" class="time-number" id="modal-hour" min="0" max="23" inputmode="numeric" value="08">
                    <button type="button" class="time-step down" onclick="stepTime('modal-hour', -1)" aria-label="Bajar hora">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
                    </button>
                </div>
                <span class="time-sep">:</span>
                <div class="time-field">
                    <button type="button" class="time-step" onclick="stepTime('modal-minute', 1)" aria-label="Subir minuto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
                    </button>
                    <input type="number" class="time-number" id="modal-minute" min="0" max="59" inputmode="numeric" value="00">
                    <button type="button" class="time-step down" onclick="stepTime('modal-minute', -1)" aria-label="Bajar minuto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
                    </button>
                </div>
            </div>

            <div class="switch-row">
                <span>Solo una vez</span>
                <label class="switch">
                    <input type="checkbox" id="modal-once" onchange="updateOnceState()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="day-pill-row" id="modal-days"></div>

            <div class="switch-row">
                <span>Activa</span>
                <label class="switch">
                    <input type="checkbox" id="modal-enabled" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAlarmModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveAlarmModal()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Days-of-week bitmask matches the firmware's DOW_* layout in alarm.h:
        // bit0=Sun .. bit6=Sat.
        const DOW = { SUN: 1, MON: 2, TUE: 4, WED: 8, THU: 16, FRI: 32, SAT: 64 };
        const DOW_WEEKDAYS = DOW.MON | DOW.TUE | DOW.WED | DOW.THU | DOW.FRI;
        const DOW_ALL = 127;
        const DAY_PILLS = [
            { bit: DOW.MON, label: 'Lu' },
            { bit: DOW.TUE, label: 'Ma' },
            { bit: DOW.WED, label: 'Mi' },
            { bit: DOW.THU, label: 'Ju' },
            { bit: DOW.FRI, label: 'Vi' },
            { bit: DOW.SAT, label: 'Sa' },
            { bit: DOW.SUN, label: 'Do' },
        ];

        // The device is the source of truth; this just mirrors the last
        // fetch. Every mutation re-fetches /api/alarms rather than trying to
        // keep a local copy in sync with what the EEPROM actually holds.
        let alarms = [];

        const NEXT_ALARM_ICON_SVG = `
            <svg viewBox="0 0 33.182 33.182" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M25.591,4.091c0-3.02-4.85-4.091-9-4.091c-4.151,0-9,1.071-9,4.091c0,3.467,4.048,9.963,6.531,12.5
                    c-2.483,2.537-6.531,9.033-6.531,12.5c0,3.021,4.849,4.091,9,4.091c4.15,0,9-1.072,9-4.091c0-3.467-4.048-9.963-6.531-12.5
                    C21.543,14.054,25.591,7.558,25.591,4.091z M24.591,29.091c0,2.062-4,3.091-8,3.091s-8-1.031-8-3.091
                    c0-3.647,5.144-11.278,7.05-12.5c-1.906-1.221-7.05-8.852-7.05-12.5c0-2.061,4-3.091,8-3.091s8,1.031,8,3.091
                    c0,3.648-5.145,11.279-7.05,12.5C19.446,17.812,24.591,25.443,24.591,29.091z"/>
                <path d="M10.527,29.957c0,0.186,2.085,0.725,6.064,0.725c3.979,0,6.064-0.539,6.064-0.725c0-2.752-6.064-4.647-6.064-9.575
                    C16.591,25.31,10.527,27.102,10.527,29.957z"/>
                <path d="M16.474,15.352l0.117,1.066l0.117-1.066c1.188-0.67,5.275-5.955,5.275-8.221c0-0.299-1.854-1.165-5.394-1.165
                    s-5.394,0.865-5.394,1.165C11.197,9.397,15.286,14.682,16.474,15.352z"/>
            </svg>
        `;

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function describeDays(days) {
            if (days === DOW_ALL) return 'Todos los días';
            if (days === DOW_WEEKDAYS) return 'Entre semana';
            if (days === (DOW.SAT | DOW.SUN)) return 'Fines de semana';
            if (days === 0) return 'Nunca';
            return DAY_PILLS.filter(d => days & d.bit).map(d => d.label).join(' ');
        }

        async function fetchAlarms() {
            try {
                const res = await fetch('/api/alarms');
                if (!res.ok) throw new Error('bad response');
                alarms = await res.json();
                renderAlarms();
            } catch (err) {
                // Don't leave a stale list on screen looking current — e.g. after
                // the device reboots and this tab's connection drops silently.
                document.getElementById('next-alarm-line').textContent = 'Sin conexión con el dispositivo';
            }
        }

        // How many minutes from now until this alarm's next occurrence,
        // walking forward day by day (today first, skipping today if its
        // time already passed) until a day its daysMask covers is found.
        function minutesUntilNext(alarm, nowDay, nowMinutes) {
            for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                const day = (nowDay + dayOffset) % 7;
                // "once" alarms ignore daysMask on the device too (see alarmMatches()
                // in alarm.cpp) — they fire on whichever day comes next.
                if (!alarm.once && !(alarm.days & (1 << day))) continue;
                const alarmMinutes = alarm.hour * 60 + alarm.minute;
                if (dayOffset === 0 && alarmMinutes <= nowMinutes) continue;
                return dayOffset * 1440 + alarmMinutes - nowMinutes;
            }
            return null; // daysMask is 0, or some other reason no day ever matches
        }

        // Shared by the "Siguiente a las" line and the hourglass badge, so
        // both always agree on which alarm is actually next.
        function findNextAlarm() {
            const active = alarms.filter(a => a.enabled && (a.once || a.days !== 0));
            if (active.length === 0) {
                return null;
            }

            // getUTC*() here, not getDay()/getHours()/getMinutes() — estimatedDeviceNow()
            // is built the disguised-local way, see phoneWallClockUnixTime()'s comment.
            const now = estimatedDeviceNow();
            const nowDay = now.getUTCDay(); // 0=Sun..6=Sat, matches the DOW_* bit layout
            const nowMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();

            let best = null;
            for (const a of active) {
                const minutesUntil = minutesUntilNext(a, nowDay, nowMinutes);
                if (minutesUntil !== null && (best === null || minutesUntil < best.minutesUntil)) {
                    best = { alarm: a, minutesUntil };
                }
            }
            return best ? best.alarm : null;
        }

        // Moves the hourglass badge without rebuilding the whole card list —
        // this runs every 30s from the time poll too, not just on data
        // changes, since "next" can shift purely from time passing.
        function updateNextAlarmBadge(next) {
            document.querySelectorAll('.alarm-card .next-badge').forEach(el => el.remove());
            if (!next) return;
            const card = document.querySelector(`.alarm-card[data-id="${next.id}"]`);
            const editBtn = card && card.querySelector('.alarm-action-btn:not(.delete)');
            if (!editBtn) return;
            const badge = document.createElement('span');
            badge.className = 'next-badge';
            badge.title = 'Siguiente alarma';
            badge.innerHTML = NEXT_ALARM_ICON_SVG;
            editBtn.insertAdjacentElement('beforebegin', badge);
        }

        function renderNextAlarmLine() {
            const line = document.getElementById('next-alarm-line');
            const next = findNextAlarm();
            line.textContent = next
                ? `Siguiente a las: ${pad2(next.hour)}:${pad2(next.minute)}`
                : 'No hay alarmas activas';
            updateNextAlarmBadge(next);
        }

        function renderAlarms() {
            const list = document.getElementById('alarm-list');
            list.innerHTML = '';

            const sorted = [...alarms].sort((a, b) => (a.hour * 60 + a.minute) - (b.hour * 60 + b.minute));

            for (const alarm of sorted) {
                const card = document.createElement('div');
                card.className = 'alarm-card' + (alarm.enabled ? '' : ' disabled');
                card.dataset.id = alarm.id; // lets updateNextAlarmBadge() find this card later

                const info = document.createElement('div');
                info.innerHTML = `
                    <div class="alarm-time">${pad2(alarm.hour)}:${pad2(alarm.minute)}</div>
                    <div class="alarm-days">${alarm.once ? 'Solo por hoy' : describeDays(alarm.days)}</div>
                `;

                const actions = document.createElement('div');
                actions.className = 'alarm-actions';

                const toggleLabel = document.createElement('label');
                toggleLabel.className = 'switch';
                toggleLabel.innerHTML = `
                    <input type="checkbox" ${alarm.enabled ? 'checked' : ''}>
                    <span class="slider"></span>
                `;
                toggleLabel.querySelector('input').addEventListener('change', async (e) => {
                    await fetch(`/api/alarms/${alarm.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hour: alarm.hour, minute: alarm.minute, days: alarm.days, enabled: e.target.checked }),
                    });
                    await fetchAlarms();
                });

                const editBtn = document.createElement('button');
                editBtn.className = 'alarm-action-btn';
                editBtn.textContent = 'Editar';
                editBtn.onclick = () => openAlarmModal(alarm.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'alarm-action-btn delete';
                deleteBtn.textContent = 'Eliminar';
                let confirmTimeout = null;
                deleteBtn.onclick = async () => {
                    if (confirmTimeout) {
                        clearTimeout(confirmTimeout);
                        await fetch(`/api/alarms/${alarm.id}`, { method: 'DELETE' });
                        await fetchAlarms();
                        return;
                    }
                    deleteBtn.textContent = '¿Confirmar?';
                    deleteBtn.classList.add('confirming');
                    confirmTimeout = setTimeout(() => {
                        deleteBtn.textContent = 'Eliminar';
                        deleteBtn.classList.remove('confirming');
                        confirmTimeout = null;
                    }, 3000);
                };

                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                actions.appendChild(toggleLabel);

                card.appendChild(info);
                card.appendChild(actions);
                list.appendChild(card);
            }

            renderNextAlarmLine();
        }

        let editingId = null;

        function renderDayPills(activeDays) {
            const row = document.getElementById('modal-days');
            row.innerHTML = '';
            for (const day of DAY_PILLS) {
                const pill = document.createElement('div');
                pill.className = 'day-pill' + (activeDays & day.bit ? ' active' : '');
                pill.textContent = day.label;
                pill.dataset.bit = day.bit;
                pill.onclick = () => pill.classList.toggle('active');
                row.appendChild(pill);
            }
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        const modalHourInput = document.getElementById('modal-hour');
        const modalMinuteInput = document.getElementById('modal-minute');

        // Clamp as the user types so the fields can never hold an invalid
        // hour/minute, and re-pad to two digits once they're done editing.
        modalHourInput.addEventListener('input', () => {
            if (modalHourInput.value === '') return;
            modalHourInput.value = clamp(parseInt(modalHourInput.value, 10) || 0, 0, 23);
        });
        modalMinuteInput.addEventListener('input', () => {
            if (modalMinuteInput.value === '') return;
            modalMinuteInput.value = clamp(parseInt(modalMinuteInput.value, 10) || 0, 0, 59);
        });
        modalHourInput.addEventListener('blur', () => {
            modalHourInput.value = pad2(clamp(parseInt(modalHourInput.value, 10) || 0, 0, 23));
        });
        modalMinuteInput.addEventListener('blur', () => {
            modalMinuteInput.value = pad2(clamp(parseInt(modalMinuteInput.value, 10) || 0, 0, 59));
        });

        // Tap the chevrons to nudge hour/minute by one, wrapping around
        // (23 -> 0, 0 -> 23) like a real clock instead of getting stuck at the ends.
        function stepTime(inputId, delta) {
            const el = document.getElementById(inputId);
            const max = inputId === 'modal-hour' ? 23 : 59;
            const current = parseInt(el.value, 10) || 0;
            const next = (current + delta + (max + 1)) % (max + 1);
            el.value = pad2(next);
        }

        // Days don't matter once the alarm is set to fire only once, so
        // gray out (and disable) the day pills while "Solo una vez" is on.
        function updateOnceState() {
            const once = document.getElementById('modal-once').checked;
            document.getElementById('modal-days').classList.toggle('once-disabled', once);
        }

        function openAlarmModal(id) {
            editingId = id;
            const modal = document.getElementById('alarm-modal');
            const enabledInput = document.getElementById('modal-enabled');
            const onceInput = document.getElementById('modal-once');

            if (id === null) {
                modalHourInput.value = '08';
                modalMinuteInput.value = '00';
                enabledInput.checked = true;
                onceInput.checked = false;
                renderDayPills(DOW_WEEKDAYS);
            } else {
                const alarm = alarms.find(a => a.id === id);
                modalHourInput.value = pad2(alarm.hour);
                modalMinuteInput.value = pad2(alarm.minute);
                enabledInput.checked = alarm.enabled;
                onceInput.checked = !!alarm.once;
                renderDayPills(alarm.days);
            }

            updateOnceState();
            modal.classList.add('open');
        }

        function closeAlarmModal() {
            document.getElementById('alarm-modal').classList.remove('open');
            editingId = null;
        }

        async function saveAlarmModal() {
            const hour = clamp(parseInt(modalHourInput.value, 10) || 0, 0, 23);
            const minute = clamp(parseInt(modalMinuteInput.value, 10) || 0, 0, 59);
            const enabled = document.getElementById('modal-enabled').checked;
            const once = document.getElementById('modal-once').checked;
            let days = 0;
            document.querySelectorAll('#modal-days .day-pill').forEach(pill => {
                if (pill.classList.contains('active')) {
                    days |= Number(pill.dataset.bit);
                }
            });

            const payload = { hour, minute, days, enabled, once };
            const url = editingId === null ? '/api/alarms' : `/api/alarms/${editingId}`;
            const method = editingId === null ? 'POST' : 'PUT';
            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            closeAlarmModal();
            await fetchAlarms();
        }

        // ---- sync banner ----

        // The device has no timezone/DST database — RTClib just decomposes
        // whatever unix timestamp it's given into calendar fields with no
        // offset applied, so whatever we send it becomes the RTC's literal
        // wall-clock hour/minute. Alarms are entered as plain local
        // hour/minute too (nothing converts them). So the "unixTime" this
        // page exchanges with the device is never actually UTC — it's the
        // phone's local wall-clock fields, encoded via Date.UTC()/decoded
        // via getUTC*() purely as a transport trick, so the browser's own
        // timezone conversion never gets a chance to shift it. Using real
        // UTC (Date.now()/getHours()) here was the bug that had the RTC
        // storing UTC while alarms compare against local — same clock,
        // same alarm, systematically off by the local UTC offset.
        function phoneWallClockUnixTime() {
            const d = new Date();
            return Math.floor(Date.UTC(
                d.getFullYear(), d.getMonth(), d.getDate(),
                d.getHours(), d.getMinutes(), d.getSeconds()
            ) / 1000);
        }

        // Offset between the device's wall clock and the phone's wall clock
        // (both expressed the disguised way above), so "what time does the
        // device think it is right now" can be estimated between /api/time
        // polls without re-fetching every second. Used by
        // renderNextAlarmLine() so "next alarm" reflects the device's own
        // notion of time (the one that actually decides when the bell
        // rings), not the phone's — those two are exactly what this banner
        // exists to compare, so they can legitimately disagree.
        let deviceTimeOffsetMs = null;

        function estimatedDeviceNow() {
            return new Date(phoneWallClockUnixTime() * 1000 + (deviceTimeOffsetMs || 0));
        }

        function updateSyncBanner(deviceUnixTime) {
            const phoneUnixTime = phoneWallClockUnixTime();
            const outOfSync = Math.abs(phoneUnixTime - deviceUnixTime) > 60; // seconds don't matter, minutes do
            deviceTimeOffsetMs = deviceUnixTime * 1000 - phoneUnixTime * 1000;

            document.getElementById('status-banner').classList.toggle('out-of-sync', outOfSync);
            document.getElementById('status-subtext').textContent = outOfSync ? '¿Está mal mi reloj?' : 'Sincronizado';

            // getUTC*() here, not getHours()/getMinutes() — see the comment
            // on phoneWallClockUnixTime() above for why.
            const d = new Date(deviceUnixTime * 1000);
            document.getElementById('status-headline').textContent = `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;

            renderNextAlarmLine(); // depends on estimatedDeviceNow(), recompute now that it moved
        }

        // Shown instead of the sync banner's normal states whenever a request
        // to the device fails — e.g. it rebooted and this tab's connection
        // dropped silently. Without this, a lost connection just freezes the
        // last-known values on screen looking exactly as current as ever,
        // which is actively misleading rather than merely stale.
        function showConnectionLost() {
            const banner = document.getElementById('status-banner');
            banner.classList.add('out-of-sync');
            document.getElementById('status-headline').textContent = '--:--';
            document.getElementById('status-subtext').textContent = 'Sin conexión con el dispositivo';
        }

        async function fetchTime() {
            try {
                const res = await fetch('/api/time');
                if (!res.ok) throw new Error('bad response');
                const data = await res.json();
                updateSyncBanner(data.unixTime);
            } catch (err) {
                showConnectionLost();
            }
        }

        async function syncTime() {
            try {
                const res = await fetch('/api/time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ unixTime: phoneWallClockUnixTime() }),
                });
                if (!res.ok) throw new Error('bad response');
                const data = await res.json();
                updateSyncBanner(data.unixTime);
            } catch (err) {
                showConnectionLost();
            }
        }

        // Both navbar buttons do the same thing: everything already saves
        // itself as it's edited (no separate "unsaved changes" to flush),
        // so "Guardar" and "Salir de Configuración" both just tell the
        // device to close config mode.
        async function exitConfigMode() {
            try {
                await fetch('/api/exit-config', { method: 'POST' });
            } catch (err) {
                // ignore — the AP dropping out from under us is the expected outcome
            }
            document.body.insertAdjacentHTML('beforeend', `
                <div class="modal-overlay open">
                    <div class="modal-card" style="text-align: center;">
                        <h3>Saliendo de configuración</h3>
                        <p style="margin: 0; color: #ffffffc0;">Ya puedes cerrar esta página. La red Wi-Fi del dispositivo se desconectará en breve.</p>
                    </div>
                </div>
            `);
        }

        fetchAlarms();
        fetchTime();
        setInterval(fetchTime, 30000); // keeps the sync banner honest while the page stays open
    </script>
</body>
</html>
