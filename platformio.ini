; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitc-02]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    ; ESP32-C3 "Super Mini" boards wire USB D+/D- to the chip's native
    ; USB-Serial/JTAG peripheral instead of an external UART bridge chip.
    ; Without these, Serial silently goes to the UART0 pins instead of the
    ; USB port, so nothing shows up in the monitor even though flashing
    ; still works fine (the ROM bootloader uses the same USB port either way).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.0.0
